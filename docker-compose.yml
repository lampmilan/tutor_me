services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erettsegi
      POSTGRES_PASSWORD: erettsegi
      POSTGRES_DB: erettsegi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erettsegi"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://erettsegi:erettsegi@db:5432/erettsegi
      WORKSPACES_ROOT: /workspaces
      EXECUTOR_IMAGE: erettsegi-executor:latest
      EXECUTION_TIMEOUT_SECONDS: "5"
      EXECUTION_MEMORY_LIMIT: 128m
      EXECUTION_CPU_LIMIT: "0.5"
      # subprocess: works in Compose without Docker-CLI-in-container.
      # docker: requires docker CLI + host-visible workspace bind mounts.
      EXECUTION_BACKEND: ${EXECUTION_BACKEND:-subprocess}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_GENERATION_ENABLED: ${AI_GENERATION_ENABLED:-false}
    volumes:
      - ./backend/app:/app/app
      - workspace_data:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # SSR fetches talk to the backend service on the Compose network
      API_URL: http://backend:8000
      # next.config.ts rewrites /api/* → this URL (browser + proxy)
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
    depends_on:
      - backend

  executor:
    build:
      context: ./docker/executor
      dockerfile: Dockerfile
    image: erettsegi-executor:latest
    profiles:
      - build-only

volumes:
  postgres_data:
  workspace_data:
